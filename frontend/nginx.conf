# nginx для frontend-контейнера (deployment.md §1.1: base-path /know, proxy api/mcp).
# upstream-имена через env (envsubst в entrypoint): контейнеры могут стартовать в любом порядке.
server {
    listen 80;
    server_name _;

    # SPA: base /know/
    location /know/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /know/index.html;
    }

    # REST API → backend
    location /know/api/ {
        proxy_pass http://${API_HOST}:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;   # лимит загрузки 50 МБ + запас
    }

    # MCP → mcp:8100 (Streamable HTTP)
    location /know/mcp/ {
        proxy_pass http://${MCP_HOST}:8100/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;         # SSE/стриминг
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Keycloak: единый адрес (KC_HTTP_RELATIVE_PATH=/auth)
    location /auth/ {
        proxy_pass http://${KC_HOST}:8080/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /metrics — только из внутренней сети (deployment.md §3); наружу закрыт
    location = /metrics {
        deny all;
    }

    # dev: редирект корня на /know/ для удобства
    location = / {
        return 302 /know/;
    }
}
